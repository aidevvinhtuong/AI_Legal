# Alembic — cấu hình migration.
# URL kết nối KHÔNG đặt ở đây: env.py đọc từ app.infra.settings để chỉ có đúng
# một nguồn cấu hình (backend/CLAUDE.md mục 4).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Tên file migration có thời gian → đọc lịch sử theo thứ tự tự nhiên
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
